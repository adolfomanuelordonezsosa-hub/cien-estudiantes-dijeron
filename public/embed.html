<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 estudiantes dijeron · Cuenca Cimarrona</title>
<link rel="icon" href="/img/icono.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<script src="/iconos.js"></script>
<style>
  /* Página para insertar el juego en otro sitio: dos pestañas (Jugar y Top 10 en vivo) */
  html, body { height: 100%; overflow: hidden; }
  body::before { display: none; }
  .marco { display: flex; flex-direction: column; height: 100%; }
  .pestanas { flex: none; display: flex; gap: .4rem; padding: .5rem; background: #fff; border-bottom: 1px solid var(--borde); }
  .pestanas button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 2px solid var(--borde); background: #fff; color: var(--verde-prof); border-radius: 12px; padding: .7rem .8rem; font: 700 1rem var(--f-texto); cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
  .pestanas button .ico { color: var(--verde); }
  .pestanas button[aria-selected="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .pestanas button[aria-selected="true"] .ico { color: var(--amarillo); }
  .pestanas button:focus-visible { outline: 3px solid var(--ocre); outline-offset: 2px; }
  .vivo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e53935; box-shadow: 0 0 0 0 rgba(229,57,53,.6); animation: pulso 1.6s infinite; }
  @keyframes pulso { 70% { box-shadow: 0 0 0 7px rgba(229,57,53,0); } 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0); } }
  .paneles { flex: 1; position: relative; min-height: 0; background: var(--fondo); }
  .paneles iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .paneles iframe[hidden] { display: block; visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<div class="marco">
  <div class="pestanas" role="tablist" aria-label="Secciones del juego">
    <button role="tab" id="tabJugar" aria-selected="true" aria-controls="fJugar" data-tab="jugar"><i data-ico="gamepad"></i>Jugar</button>
    <button role="tab" id="tabTop" aria-selected="false" aria-controls="fTop" data-tab="top"><i data-ico="trophy"></i>Top 10 en vivo <span class="vivo" aria-hidden="true"></span></button>
  </div>
  <div class="paneles">
    <iframe id="fJugar" role="tabpanel" aria-labelledby="tabJugar" title="Jugar 100 estudiantes dijeron" src="/?embed=1" allow="autoplay; fullscreen"></iframe>
    <iframe id="fTop" role="tabpanel" aria-labelledby="tabTop" title="Top 10 en vivo" hidden></iframe>
  </div>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  pintarIconos();
  const jugar = $('#fJugar'), top = $('#fTop');
  function abrir(tab) {
    const esJuego = tab === 'jugar';
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    jugar.hidden = !esJuego; top.hidden = esJuego;
    // el ranking se carga hasta que alguien lo abre, y nunca tiene sonido
    if (!esJuego && !top.src) top.src = '/tv?embed=1';
    // el juego se calla mientras se ve el ranking
    try { jugar.contentWindow.postMessage({ tipo: 'silencio', valor: !esJuego }, location.origin); } catch { /* */ }
    try { localStorage.setItem('ced_embed_tab', tab); } catch { /* */ }
  }
  document.querySelector('.pestanas').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) abrir(b.dataset.tab); });
  document.querySelector('.pestanas').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const t = document.activeElement.dataset.tab === 'jugar' ? 'top' : 'jugar';
    abrir(t); document.querySelector(`[data-tab="${t}"]`).focus();
  });
  // el ranking puede pedir "ir a jugar"
  addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.tipo === 'irA') abrir(e.data.tab); });
})();
</script>
</body>
</html>
